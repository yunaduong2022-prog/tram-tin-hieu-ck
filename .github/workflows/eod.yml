name: Cập nhật dữ liệu cuối phiên

on:
  schedule:
    - cron: "45 8 * * 1-5"      # 15:45 giờ Việt Nam, thứ Hai đến thứ Sáu
  workflow_dispatch:
    inputs:
      full:
        description: "Tải lại toàn bộ lịch sử (lần đầu hoặc khi cần làm lại)"
        type: boolean
        default: false
      start:
        description: "Ngày bắt đầu lịch sử khi tải đầy đủ (YYYY-MM-DD)"
        type: string
        default: "2021-01-01"

permissions:
  contents: write

concurrency:
  group: eod-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-eod.txt

      - name: Cài thư viện
        run: pip install -r requirements-eod.txt

      - name: Lấy dữ liệu cuối phiên
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.full }}" = "true" ]; then ARGS="--full"; fi
          if [ -n "${{ inputs.start }}" ]; then ARGS="$ARGS --start ${{ inputs.start }}"; fi
          python eod_fetch.py $ARGS

      - name: Lưu vào repo
        if: always()
        run: |
          git config user.name "eod-bot"
          git config user.email "eod-bot@users.noreply.github.com"
          git add data/eod_prices.csv data/eod_meta.json
          if git diff --cached --quiet; then
            echo "Không có thay đổi dữ liệu."
          else
            git commit -m "Dữ liệu cuối phiên $(TZ=Asia/Ho_Chi_Minh date +%d/%m/%Y)"
            git pull --rebase --autostash
            git push
          fi
