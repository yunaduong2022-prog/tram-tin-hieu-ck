name: Cap nhat chi so nhom von hoa

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Tai lai toan bo lich su (de true cho lan chay dau tien)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: eod-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-eod.txt

      - name: Cai thu vien
        run: pip install -r requirements-eod.txt

      - name: Dang ky thiet bi vnstock
        continue-on-error: true
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          printf '%s' "$VNSTOCK_API_KEY" | vnstock register --stdin
          vnstock status

      - name: Lay du lieu VN30, VNMidcap, VNSmallcap, VN100
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.full }}" = "true" ]; then ARGS="--full"; fi
          python update_index.py $ARGS

      - name: Luu vao repo
        run: |
          git config user.name "eod-bot"
          git config user.email "eod-bot@users.noreply.github.com"
          git add data/index_prices.csv
          if git diff --cached --quiet; then
            echo "Khong co thay doi du lieu."
            exit 0
          fi
          git commit -m "Du lieu chi so nhom von hoa $(TZ=Asia/Ho_Chi_Minh date +%d/%m/%Y)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              echo "Push thanh cong."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          echo "Push that bai sau 5 lan thu."
          exit 1
